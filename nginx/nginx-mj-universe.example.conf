# Eksempel for mj-universe.net (statisk HTML). Lim inn i server {} eller inkluder med include.
# Juster root til der filene faktisk ligger på VPS-en.
#
# Gjør at /mariellberntzen og /mariellberntzen/ fungerer uten .html (matcher mariellberntzen.html
# eller mappen mariellberntzen/index.html).

server {
    listen 443 ssl http2;
    server_name mj-universe.net www.mj-universe.net;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    root /home/mj-universe/htdocs/mj-universe.net;
    index index.html;

    # Valgfritt: tving https
    # if ($scheme != "https") { return 301 https://$host$request_uri; }

    # Valgfritt: fjern .html fra URL (SEO — én kanonisk URL)
    location = /about.html { return 301 /about/; }
    location = /mariellberntzen.html { return 301 /mariellberntzen/; }
    location = /mariell-berntzen.html { return 301 /mariell-berntzen/; }
    location = /jhonatanwik.html { return 301 /jhonatanwik/; }
    location = /jhonatan-wik.html { return 301 /jhonatan-wik/; }
    location = /snapchat.html { return 301 /snapchat/; }
    location = /fitness-serie.html { return 301 /fitness/; }
    location = /vlog.html { return 301 /vlog/; }
    location = /blog.html { return 301 /blog/; }

    # Rekkefølge: eksakt fil → samme navn + .html → katalog med index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Vanlig cache for statiske assets (valgfritt)
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
